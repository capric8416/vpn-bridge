name: vpnbridge release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect-changes:
    name: detect vpnbridge changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare with previous tag
        id: changes
        shell: bash
        run: |
          previous_tag="$(git describe --tags --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true)"
          if [[ -z "$previous_tag" ]]; then
            changed=true
            echo "No previous tag found; building vpnbridge artifacts."
          elif git diff --quiet "$previous_tag" "$GITHUB_SHA" -- \
            crates/host crates/vm crates/proto; then
            changed=false
            echo "No host/vm/proto changes since $previous_tag; skipping vpnbridge release."
          else
            changed=true
            echo "Detected host/vm/proto changes since $previous_tag."
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  build-linux:
    name: build linux x64
    needs: detect-changes
    if: needs.detect-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
          components: rustfmt

      - name: Install Zig and cargo-zigbuild
        shell: bash
        run: |
          python3 -m pip install --user ziglang
          python_bin_dir="$(python3 -m site --user-base)/bin"
          export PATH="$python_bin_dir:$PATH"
          mkdir -p "$RUNNER_TEMP/zig-bin"
          ln -s "$(command -v python-zig)" "$RUNNER_TEMP/zig-bin/zig"
          echo "$RUNNER_TEMP/zig-bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/zig-bin:$PATH"
          cargo install cargo-zigbuild
          zig version

      - name: Check formatting
        run: cargo fmt -p vpnbridge-host -p vpnbridge-vm -p vpnbridge-proto -- --check

      - name: Test
        run: cargo test -p vpnbridge-host -p vpnbridge-vm -p vpnbridge-proto

      - name: Build Linux release with glibc 2.17
        run: cargo zigbuild --release -p vpnbridge-host --target x86_64-unknown-linux-gnu.2.17

      - name: Package Linux artifact
        shell: bash
        run: |
          mkdir -p release
          tar -czf "release/vpnbridge-${{ github.ref_name }}-linux-x64.tar.gz" \
            -C target/x86_64-unknown-linux-gnu/release vpnbridge-host \
            -C "$GITHUB_WORKSPACE/config" host.toml

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: release/*
          if-no-files-found: error

  build-windows:
    name: build windows x64
    needs: detect-changes
    if: needs.detect-changes.outputs.changed == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Windows release
        run: cargo build --release -p vpnbridge-vm

      - name: Package Windows artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item config\vm.toml release\vm.toml
          Compress-Archive `
            -Path target\release\vpnbridge-vm.exe, release\vm.toml `
            -DestinationPath "release\vpnbridge-${{ github.ref_name }}-windows-x64.zip" `
            -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: release/*.zip
          if-no-files-found: error

  publish-release:
    name: publish release
    needs:
      - detect-changes
      - build-linux
      - build-windows
    if: >-
      always() &&
      needs.detect-changes.outputs.changed == 'true' &&
      needs.build-linux.result == 'success' &&
      needs.build-windows.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release/**
