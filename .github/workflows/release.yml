name: release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build-linux:
    name: build linux x64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
          components: rustfmt

      - name: Install Zig and cargo-zigbuild
        shell: bash
        run: |
          python3 -m pip install --user ziglang
          python_bin_dir="$(python3 -m site --user-base)/bin"
          export PATH="$python_bin_dir:$PATH"
          mkdir -p "$RUNNER_TEMP/zig-bin"
          ln -s "$(command -v python-zig)" "$RUNNER_TEMP/zig-bin/zig"
          echo "$RUNNER_TEMP/zig-bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/zig-bin:$PATH"
          cargo install cargo-zigbuild
          zig version

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test
        run: cargo test --workspace

      - name: Build Linux release with glibc 2.17
        run: cargo zigbuild --release -p vpnbridge-host --target x86_64-unknown-linux-gnu.2.17

      - name: Package Linux artifact
        shell: bash
        run: |
          mkdir -p release
          tar -czf "release/vpnbridge-${{ github.ref_name }}-linux-x64.tar.gz" \
            -C target/x86_64-unknown-linux-gnu/release vpnbridge-host \
            -C "$GITHUB_WORKSPACE/config" host.toml

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: release/*
          if-no-files-found: error

  build-windows:
    name: build windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Windows release
        run: cargo build --release -p vpnbridge-vm

      - name: Package Windows artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item config\vm.toml release\vm.toml
          Compress-Archive `
            -Path target\release\vpnbridge-vm.exe, release\vm.toml `
            -DestinationPath "release\vpnbridge-${{ github.ref_name }}-windows-x64.zip" `
            -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: release/*.zip
          if-no-files-found: error

  publish-release:
    name: publish release
    needs:
      - build-linux
      - build-windows
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release/**
