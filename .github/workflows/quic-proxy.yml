name: proxy release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect-changes:
    name: detect proxy changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare with previous tag
        id: changes
        shell: bash
        run: |
          previous_tag="$(git describe --tags --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true)"
          if [[ -z "$previous_tag" ]]; then
            changed=true
            echo "No previous tag found; building proxy artifacts."
          elif git diff --quiet "$previous_tag" "$GITHUB_SHA" -- \
            crates/proxy-client crates/proxy-server; then
            changed=false
            echo "No proxy-client/proxy-server changes since $previous_tag; skipping proxy release."
          else
            changed=true
            echo "Detected proxy-client/proxy-server changes since $previous_tag."
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  build-linux:
    name: build proxy linux x64
    needs: detect-changes
    if: needs.detect-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Test proxy crates
        run: cargo test -p proxy-client -p proxy-server

      - name: Build proxy release
        run: cargo build --release -p proxy-client -p proxy-server

      - name: Package Linux artifact
        shell: bash
        run: |
          mkdir -p release
          tar -czf "release/proxy-${{ github.ref_name }}-linux-x64.tar.gz" \
            -C target/release proxy-client proxy-server \
            -C "$GITHUB_WORKSPACE/config" proxy-client.toml proxy-server.toml

      - uses: actions/upload-artifact@v4
        with:
          name: proxy-linux-x64
          path: release/*.tar.gz
          if-no-files-found: error

  build-windows:
    name: build proxy windows x64
    needs: detect-changes
    if: needs.detect-changes.outputs.changed == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Test proxy crates
        run: cargo test -p proxy-client -p proxy-server

      - name: Build proxy release
        run: cargo build --release -p proxy-client -p proxy-server

      - name: Package Windows artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item config\proxy-client.toml release\proxy-client.toml
          Copy-Item config\proxy-server.toml release\proxy-server.toml
          $files = @(
            "target\release\proxy-client.exe"
            "target\release\proxy-server.exe"
            "release\proxy-client.toml"
            "release\proxy-server.toml"
          )
          Compress-Archive -Path $files `
            -DestinationPath "release\proxy-${{ github.ref_name }}-windows-x64.zip" `
            -Force

      - uses: actions/upload-artifact@v4
        with:
          name: proxy-windows-x64
          path: release/*.zip
          if-no-files-found: error

  build-macos:
    name: build proxy macos
    needs: detect-changes
    if: needs.detect-changes.outputs.changed == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Test proxy crates
        run: cargo test -p proxy-client -p proxy-server

      - name: Build proxy release
        run: cargo build --release -p proxy-client -p proxy-server

      - name: Package macOS artifact
        shell: bash
        run: |
          mkdir -p release
          tar -czf "release/proxy-${{ github.ref_name }}-macos.tar.gz" \
            -C target/release proxy-client proxy-server \
            -C "$GITHUB_WORKSPACE/config" proxy-client.toml proxy-server.toml

      - uses: actions/upload-artifact@v4
        with:
          name: proxy-macos
          path: release/*.tar.gz
          if-no-files-found: error

  publish-release:
    name: publish proxy release
    needs:
      - detect-changes
      - build-linux
      - build-windows
      - build-macos
    if: >-
      always() &&
      needs.detect-changes.outputs.changed == 'true' &&
      needs.build-linux.result == 'success' &&
      needs.build-windows.result == 'success' &&
      needs.build-macos.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release/**
