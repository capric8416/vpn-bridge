# Shared listen address: UDP carries QUIC and TCP carries the TLS gRPC fallback.
# Open this port for both UDP and TCP in the firewall.
listen = "0.0.0.0:17443"

# Each transport can be disabled independently for testing. Optional address
# overrides allow QUIC and gRPC to listen on different ports; without them both
# use `listen` above.
quic_enabled = true
grpc_enabled = true
# quic_listen = "0.0.0.0:17443"
# grpc_listen = "0.0.0.0:17444"

token = "e5e9aefc150075dd637f8997f1aec75a2925dc42e61895c5bdf2cf3c0d3878b6f8760dc1fa404dbefbc22755d1b07f87e91ffffee09b6b3b4709a28e0c37c759"
server_name = "proxy-server.local"

