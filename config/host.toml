# Pinned to their current next hop so a broad entry in `routes` cannot swallow
# them. The host <-> VM network belongs here whenever it overlaps.
exclude = [
    "192.168.122.0/24",
    "224.0.0.251/32",
    "239.255.255.250/32",
]

[server]
# The Windows VM, on the host <-> VM network (libvirt default: 192.168.122.0/24).
address = "192.168.122.240:17321"
# Must match vm.toml. Leave empty to disable authentication.
token = "2814c7f16f91720c80d2692befcde5471f68959395e38b9e8a7dfb177e12d72c670eb29a86eab4825fdcef32ea2a130ef6fbd22f32fe121786e722c2dc11a3a8"
connect_timeout_ms = 10000
tcp_nodelay = true

[tun]
name = "vpnbr0"
address = "10.211.0.1"
netmask = "255.255.255.0"
mtu = 1500
# Install/remove the routes above automatically on start/stop.
auto_route = true

# Optional: resolve internal names through the VPN's DNS.
# Point systemd-resolved at it for the internal domains, e.g.
#   resolvectl dns vpnbr0 127.0.0.1:15353
#   resolvectl domain vpnbr0 ~corp.example.com
[dns]
listen = "127.0.0.1:15353"
upstream = ["10.20.0.53:53"]
timeout_ms = 5000
