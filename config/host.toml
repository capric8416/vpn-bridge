# vpnbridge-host — runs on the linux host as root (or with CAP_NET_ADMIN).
#
# NOTE: `routes` and `exclude` are top-level keys, so they must stay above the
# first [table] header — otherwise TOML folds them into that table.

# Networks only reachable through the VPNs running inside the VM.
# Everything else keeps using the host's normal routing.
routes = [
    "10.0.13.41/32",
    "10.0.26.111/32",
    "10.0.26.112/31",
    "10.0.80.6/31",
    "10.0.80.90/31",
