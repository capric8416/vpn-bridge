    "10.0.81.192/27",
    "10.0.81.224/28",
    "10.0.81.240/29",
    "10.0.81.248/30",
    "10.0.81.252/31",
    "10.0.81.254/32",
    "10.0.127.23/32",
    "10.0.127.24/29",
