[package]
name = "vpnbridge-proto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Wire protocol shared by the vpnbridge host and VM agents"

[features]
default = []
grpc = ["dep:prost", "dep:tonic", "dep:tonic-prost"]

[dependencies]
tokio = { workspace = true }
prost = { version = "0.14", optional = true }
tonic = { version = "0.14.6", default-features = false, features = ["codegen"], optional = true }
tonic-prost = { version = "0.14.6", optional = true }

[build-dependencies]
protoc-bin-vendored = "3"
tonic-prost-build = "0.14.6"
